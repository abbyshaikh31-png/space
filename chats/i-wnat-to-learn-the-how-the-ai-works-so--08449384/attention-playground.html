<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attention Playground</title><style>:root{--bg:#080d1a;--ink:#e8eeff;--mut:#9fb0d0;--ac:#6ee7c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16264a,#080d1a);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1000px;margin:auto;padding:36px 20px 70px}h1{font-size:2.2rem;margin:0 0 4px}h2{color:var(--ac);font-size:1.25rem;margin-top:34px}p{color:var(--mut)}.mut{color:var(--mut);font-size:.9rem}.tok{display:inline-block;padding:8px 12px;margin:5px;border-radius:10px;background:#16213d;border:1px solid #2d4368;font-family:ui-monospace,monospace;cursor:pointer;transition:.2s}.tok.sel{border-color:var(--ac);box-shadow:0 0 0 3px #6ee7c133}.tok small{display:block;color:var(--mut);font-size:.72rem}table{border-collapse:collapse;margin:12px 0}td,th{border:1px solid #2d4368;padding:12px 14px;text-align:center;font-family:ui-monospace,monospace;font-weight:500}td.hi{outline:2px solid var(--ac);outline-offset:-2px}th{background:#142039;color:#bcd7ff;font-family:system-ui;font-size:.85rem}td.hk{background:#0d1830}td.hv{background:#182a13}.rowq{color:#ffd479;font-size:.95rem}.bars{margin:14px 0}.bar{display:flex;align-items:center;gap:10px;margin:5px 0;font-family:ui-monospace,monospace;font-size:.85rem}.bar i{display:block;height:14px;background:linear-gradient(90deg,#6ee7c1,#8fb8ff);border-radius:7px}.btn{background:#16305a;border:1px solid #35578f;color:#cfe1ff;padding:9px 15px;border-radius:9px;cursor:pointer;font:inherit}.btn:hover{border-color:var(--ac)}svg text{fill:#cfe1ff;font-family:system-ui}</style></head><body><main>
<h1>Attention Playground</h1>
<p class="mut">Click a token to change the <b>query</b> position. Everything below recomputes live: scores &rarr; softmax &rarr; context vector.</p>
<div id="tokens"></div>
<h2>Score matrix &nbsp;S = QK&sup2;/&radic;d<sub>k</sub> (pre-softmax)</h2>
<div id="scores"></div>
<h2>Attention weights &nbsp;A = softmax(S)</h2>
<div id="weights"></div>
<h2>Query rows explained</h2>
<div id="bars"></div>
<h2>Pipeline</h2>
<svg viewBox="0 0 860 130" style="max-width:100%"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#ffd479"/></marker></defs><g stroke="#ffd479" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M130 55H250"/><path d="M350 55H470"/><path d="M570 55H690"/></g><g fill="#16213d" stroke="#35578f"><rect x="20" y="30" width="110" height="50" rx="9"/><rect x="250" y="30" width="100" height="50" rx="9"/><rect x="470" y="30" width="100" height="50" rx="9"/><rect x="690" y="30" width="150" height="50" rx="9"/></g><g text-anchor="middle" font-size="15"><text x="75" y="60">Tokens</text><text x="300" y="60">Q, K, V</text><text x="520" y="60">Attention</text><text x="765" y="60">Context vector</text></g></svg>
<h2>Shapes</h2><table id="shapes"></table>
</main>
<script>
const TOK=["The","animal","did","not","cross","the","street"];
const Q=[[1,.2,0,.1],[.1,1,.9,0],[0,.9,1,.2],[.2,0,.2,1],[.9,.1,.3,.4],[.1,.4,.1,.9],[.3,.9,0,.2]];
const K=[[1,.1,.3,0],[.2,1,.8,.1],[.3,.7,1,.2],[0,.2,.1,1],[.8,.3,.2,.5],[.2,.5,.2,.8],[.4,.9,.1,.3]];
const V=[[1,0],[0,1],[.7,.2],[.2,.8],[.4,.4],[.9,.1],[.3,.6]];
let sel=1;
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
function sm(arr){const m=Math.max(...arr),e=arr.map(x=>Math.exp(x-m)),s=e.reduce((x,y)=>x+y,0);return e.map(x=>x/s);}
const dk=Math.sqrt(4);
function render(){
 const t=document.getElementById("tokens");t.innerHTML="";
 TOK.forEach((w,i)=>{const d=document.createElement("div");d.className="tok"+(i===sel?" sel":"");
  d.innerHTML=w+"<small>pos "+i+"</small>";d.onclick=()=>{sel=i;render()};t.appendChild(d);});
 const S=TOK.map((_,i)=>TOK.map((__,j)=>dot(Q[i],K[j])/dk));
 const A=S.map(r=>sm(r));
 document.getElementById("scores").innerHTML="<table><tr><th>query \\ key</th>"+TOK.map(w=>"<th>"+w+"</th>").join("")+"</tr>"+
  S.map((r,i)=>"<tr><th style='text-align:left'>"+TOK[i]+"</th>"+r.map(v=>"<td"+(i===sel?" class='hi'":"")+">"+v.toFixed(2)+"</td>").join("")+"</tr>").join("")+"</table>";
 document.getElementById("weights").innerHTML="<table><tr><th>query \\ key</th>"+TOK.map(w=>"<th>"+w+"</th>").join("")+"</tr>"+
  A.map((r,i)=>"<tr><th style='text-align:left'>"+TOK[i]+"</th>"+r.map(v=>"<td"+(i===sel?" class='hi'":"")+">"+v.toFixed(3)+"</td>").join("")+"</tr>").join("")+"</table>";
 const w=A[sel];
 document.getElementById("bars").innerHTML='<div class="rowq">Query = "'+TOK[sel]+'" &rarr; weights sum to '+w.reduce((a,b)=>a+b,0).toFixed(3)+'</div>'+
  TOK.map((t2,j)=>'<div class="bar"><span style="width:62px">'+t2+'</span><i style="width:'+(w[j]*300).toFixed(0)+'px"></i><span>'+w[j].toFixed(3)+'</span></div>').join("");
 document.getElementById("shapes").innerHTML="<tr><th>Tensor</th><th>Shape</th></tr>"+
  [["X (embeddings)","(1, 7, 32)"],["Q, K","(1, 7, 4)"],["V","(1, 7, 2)"],["S = QK^T","(1, 7, 7)"],["A = softmax(S)","(1, 7, 7)"],["Z = AV","(1, 7, 2)"]]
  .map(r=>"<tr><td style='text-align:left'>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("");
}
render();
</script></body></html>
