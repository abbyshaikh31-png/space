<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap the Target</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 8px; }
  #hud { display: flex; gap: 24px; font-size: 1.1rem; margin-bottom: 10px; }
  #hud b { color: #fbbf24; }
  #board { position: relative; width: min(92vw, 420px); height: min(60vh, 380px); background: #1e293b; border-radius: 14px; overflow: hidden; cursor: crosshair; box-shadow: 0 0 20px rgba(56,189,248,.25); }
  #target { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #f472b6, #be123c); box-shadow: 0 0 14px #f43f5e; cursor: pointer; transition: transform .08s; user-select: none; }
  #target:active { transform: scale(.85); }
  #msg { margin-top: 12px; font-size: 1rem; color: #94a3b8; min-height: 1.4em; }
  button { background: #38bdf8; border: 0; color: #06283d; font-weight: 700; padding: 10px 22px; border-radius: 9px; font-size: 1rem; cursor: pointer; margin-top: 12px; }
  button:hover { background: #7dd3fc; }
</style>
</head>
<body>
<h1>🎯 Tap the Target</h1>
<div id="hud"><span>Score: <b id="score">0</b></span><span>Misses: <b id="miss">0</b></span><span>Time: <b id="time">20</b>s</span></div>
<div id="board"><div id="target" hidden></div></div>
<div id="msg">Press Start to play. Tap targets fast!</div>
<button id="btn">Start</button>
<script>
const board = document.getElementById('board'), t = document.getElementById('target'),
      scoreEl = document.getElementById('score'), missEl = document.getElementById('miss'),
      timeEl = document.getElementById('time'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
let score = 0, misses = 0, timeLeft = 20, timer = null, moveTimer = null;

function placeTarget() {
  const bw = board.clientWidth, bh = board.clientHeight, s = 44;
  const x = Math.random() * (bw - s), y = Math.random() * (bh - s);
  t.style.left = x + 'px'; t.style.top = y + 'px';
  const size = 36 + Math.random() * 20; // shrink over misses for difficulty
  t.style.width = size + 'px'; t.style.height = size + 'px';
}

function start() {
  score = 0; misses = 0; timeLeft = 20;
  scoreEl.textContent = 0; missEl.textContent = 0; timeEl.textContent = 20;
  btn.textContent = 'Restart'; msg.textContent = 'GO! Tap the targets!';
  t.hidden = false; placeTarget();
  clearInterval(timer); clearInterval(moveTimer);
  timer = setInterval(() => {
    timeLeft--; timeEl.textContent = timeLeft;
    if (timeLeft <= 0) end();
  }, 1000);
  moveTimer = setInterval(placeTarget, 900);
}

board.addEventListener('click', e => {
  if (timeLeft <= 0 || t.hidden) return;
  if (e.target === t) {
    score++;
    scoreEl.textContent = score;
    placeTarget();
  } else {
    misses++;
    missEl.textContent = misses;
  }
});

function end() {
  clearInterval(timer); clearInterval(moveTimer);
  t.hidden = true;
  msg.textContent = "Time's up! Final score: " + score + " (" + misses + " misses). " +
    (score >= 25 ? 'Blazing fast!' : score >= 15 ? 'Nice reflexes!' : 'Try again, faster!');
}

btn.addEventListener('click', start);
</script>
</body>
</html>
