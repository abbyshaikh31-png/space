<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Surfers - Endless Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06080f;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#game{display:block;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08)}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,rgba(40,60,110,.55),rgba(3,5,12,.93));z-index:5}
#panel{text-align:center;padding:26px 30px;border-radius:18px;background:rgba(11,16,33,.78);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.6);max-width:min(92vw,430px)}
h1{font-size:clamp(26px,6vw,44px);line-height:1.05;background:linear-gradient(92deg,#ffd93d,#ff7a45,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#a8bcdc;font-size:14px;line-height:1.6;margin:10px 0}
.btn{margin-top:16px;border:0;cursor:pointer;padding:13px 32px;border-radius:999px;font-size:17px;font-weight:800;color:#0b1020;background:linear-gradient(92deg,#ffd93d,#ff9f1c);box-shadow:0 6px 0 #b35c00}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b35c00}
.keys{margin-top:14px;font-size:13px;color:#93aad2;line-height:2}
kbd{display:inline-block;background:#1a2444;border:1px solid #35477d;border-bottom-width:2px;border-radius:6px;padding:1px 8px;margin:0 2px;font:inherit;font-weight:700;color:#e2ecff}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="overlay"><div id="panel">
<h1 id="title">SUBWAY SURFERS</h1>
<p id="msg">Dodge trains, jump barriers, slide under beams and grab coins.<br>How far can you run?</p>
<button class="btn" id="btn">PLAY</button>
<div class="keys" id="keyrow"><kbd>&larr;</kbd><kbd>&rarr;</kbd> lane &nbsp; <kbd>&uarr;</kbd>/<kbd>Space</kbd> jump &nbsp; <kbd>&darr;</kbd> slide &nbsp; <kbd>P</kbd> pause</div>
</div></div>
</div>
<script>
"use strict";
(function(){
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const W=480,H=720,CX=240,HORIZON=300;
const LANE_X=[130,240,350];
function resize(){const s=Math.min(Math.min(window.innerWidth,560)/W,(window.innerHeight-20)/H);
 cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';
 const d=Math.min(window.devicePixelRatio||1,2);cvs.width=W*d;cvs.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const pick=a=>a[(Math.random()*a.length)|0];let state='menu',score=0,dist=0,speed=400,runT=0,coinCount=0,multi=1;
let objs=[],coins=[],parts=[],pops=[],spawnT=0.4,shake=0;
let P={lane:1,x:240,y:0,vy:0,slide:0,inv:0,shield:0,magnet:0,x2:0};
const overlay=document.getElementById('overlay');
const titleEl=document.getElementById('title'),msgEl=document.getElementById('msg');
const btnEl=document.getElementById('btn'),keyrow=document.getElementById('keyrow');
function showOverlay(title,msg,btn,keys){titleEl.textContent=title;msgEl.innerHTML=msg;btnEl.textContent=btn;
 keyrow.className=keys?'':'hide';overlay.classList.remove('hide');}
function hideOverlay(){overlay.classList.add('hide');}
function reset(){score=0;dist=0;runT=0;coinCount=0;multi=1;speed=400;spawnT=0.5;shake=0;
 objs=[];coins=[];parts=[];pops=[];
 P={lane:1,x:LANE_X[1],y:0,vy:0,slide:0,inv:0,shield:0,magnet:0,x2:0};}
function start(){reset();state='play';hideOverlay();}
btnEl.addEventListener('click',()=>{if(state!=='play')start();});
function move(d){if(state!=='play')return;P.lane=clamp(P.lane+d,0,2);}
function jump(){if(state!=='play')return;if(P.y<1&&P.slide<=0)P.vy=780;}
function slide(){if(state!=='play')return;if(P.y<1)P.slide=0.8;}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a'){move(-1);e.preventDefault();}
 else if(k==='arrowright'||k==='d'){move(1);e.preventDefault();}
 else if(k==='arrowup'||k==='w'||k===' '){jump();e.preventDefault();}
 else if(k==='arrowdown'||k==='s'){slide();e.preventDefault();}
 else if(k==='p'){togglePause();}
 else if(k==='enter'&&state!=='play')start();});
function togglePause(){if(state==='play'){state='paused';showOverlay('PAUSED','Take a breather.','RESUME',true);}
 else if(state==='paused'){state='play';hideOverlay();}}
let sx=0,sy=0;
cvs.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
cvs.addEventListener('touchend',e=>{if(state!=='play'){start();return;}
 const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)>26&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
 else if(Math.abs(dy)>26){if(dy<0)jump();else slide();}},{passive:true});
cvs.addEventListener('pointerdown',()=>{if(state==='menu'||state==='dead')start();});function spawn(){
 const lane=(Math.random()*3)|0;
 const r=Math.random();
 const base={lane,x:LANE_X[lane],z:0,w:2.6};
 if(r<0.30){objs.push({type:'train',lane,x:LANE_X[lane],z:0,len:5.2,w:2.2,kind:pick(['red','blue','green','yellow'])});}
 else if(r<0.55){objs.push({type:'barrier',lane,x:LANE_X[lane],z:0,w:2.4,h:0.9});}
 else if(r<0.78){objs.push({type:'beam',lane,x:LANE_X[lane],z:0,w:2.4,low:0.85});}
 else{objs.push({type:'ramp',lane,x:LANE_X[lane],z:0,w:2.2});}
 const cn=2+((Math.random()*4)|0);
 for(let i=0;i<cn;i++)coins.push({x:LANE_X[lane],z:-i*2.2,y:1.05,got:false});
}
function addPart(x,y,c,n){for(let i=0;i<(n||8);i++)parts.push({x,y,vx:rand(-90,90),vy:rand(-140,40),life:rand(0.35,0.8),c});}
function pop(t,x,y,c){pops.push({t,x,y,c,life:0.8});}
function die(){
 if(P.shield>0){P.shield=0;P.inv=1.2;shake=8;addPart(P.x,2.4,'#59d2ff',16);pop('SHIELD',P.x,2.9,'#59d2ff');return;}
 state='dead';shake=14;addPart(P.x,2.2,'#ff4d6d',26);
 let best=0;try{best=+(localStorage.getItem('ss_best')||0);}catch(e){}
 if(score>best){best=Math.floor(score);try{localStorage.setItem('ss_best',best);}catch(e){}}
 showOverlay('GAME OVER','Score <b>'+Math.floor(score)+'</b> &nbsp;|&nbsp; Coins <b>'+coinCount+'</b> &nbsp;|&nbsp; Best <b>'+best+'</b>','RUN AGAIN',true);
}
function update(dt){
 runT+=dt;
 speed=Math.min(1150,speed+dt*7);
 score+=speed*dt*0.06*multi;
 dist+=speed*dt;
 spawnT-=dt;
 if(spawnT<=0){spawn();spawnT=Math.max(0.34,1.15-runT*0.012);}
 // player physics
 P.vy-=2000*dt;P.y+=P.vy*dt;
 if(P.y<0){P.y=0;P.vy=0;}
 if(P.slide>0)P.slide-=dt;
 if(P.inv>0)P.inv-=dt;
 if(P.shield>0)P.shield-=dt;
 if(P.magnet>0)P.magnet-=dt;
 const tx=LANE_X[P.lane];
 P.x+=(tx-P.x)*Math.min(1,dt*14);
 // objects move
 for(const o of objs){o.z+=speed*dt*0.06;}
 for(const c of coins){c.z+=speed*dt*0.06;c.x+=(LANE_X[P.lane]-c.x)*0;}
 for(const o of objs){if(o.z>22)o.dead=true;}
 for(const c of coins){if(c.z>22)c.got=true;}
 objs=objs.filter(o=>!o.dead);
 coins=coins.filter(c=>!c.got);
 // coin pickup
 for(const c of coins){
  if(c.got)continue;
  const dz=Math.abs(c.z-3.0);
  if(dz<0.75&&Math.abs(c.x-P.x)<1.0&&Math.abs(c.y-(P.y+1.1))<1.2){
   c.got=true;coinCount++;score+=10*multi;addPart(c.x,c.y,'#ffd93d',6);pop('+'+10*multi,c.x,c.y,'#ffd93d');
   if(coinCount%25===0){multi=Math.min(5,multi+1);pop('x'+multi+' SCORE',P.x,3.4,'#7cf6a5');}
  }
 }
 // collisions
 for(const o of objs){
  if(Math.abs(o.z-3.0)>0.9)continue;
  if(Math.abs(o.x-P.x)>1.05)continue;
  if(o.type==='barrier'){if(P.y<0.85){die();return;}}
  else if(o.type==='train'){if(P.y<1.4){die();return;}}
  else if(o.type==='beam'){if(P.y>0.55){die();return;} if(P.slide>0){o.dead=true;score+=15;pop('+15',o.x,2,'#7cf6a5');}}
  else if(o.type==='ramp'){if(P.y<0.1&&P.vy<=0){P.vy=700;P.y=Math.max(P.y,0.05);}}
 }
 // particles
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=520*dt;p.life-=dt;}
 parts=parts.filter(p=>p.life>0);
 for(const p of pops){p.life-=dt;p.y-=dt*0.7;}
 pops=pops.filter(p=>p.life>0);
 if(shake>0)shake-=dt*30;
}// ---------- rendering ----------
function proj(z){const s=0.2+0.2667*z;return{s:s,gy:HORIZON+(H-140-HORIZON)*s};}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,HORIZON+40);
 g.addColorStop(0,'#0b1030');g.addColorStop(.6,'#243063');g.addColorStop(1,'#4a3a6b');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,HORIZON+40);
 // skyline
 ctx.fillStyle='#131a3d';
 for(let i=0;i<26;i++){const bw=18+((i*37)%40),bh=40+((i*53)%120),bx=i*19-8;
  ctx.fillRect(bx,HORIZON-bh+10,bw,bh);
  ctx.fillStyle='rgba(255,220,140,.13)';
  for(let w=0;w<bw-6;w+=8)for(let h=8;h<bh-8;h+=12)if((i*7+w*3+h)%5<2)ctx.fillRect(bx+w+3,HORIZON-bh+10+h,3,5);
  ctx.fillStyle='#131a3d';}
 // ground
 const gg=ctx.createLinearGradient(0,HORIZON,0,H);
 gg.addColorStop(0,'#2a2438');gg.addColorStop(.35,'#3b3049');gg.addColorStop(1,'#171326');
 ctx.fillStyle=gg;ctx.fillRect(0,HORIZON+40,W,H-HORIZON-40);
 // lane strips (perspective)
 for(let l=0;l<3;l++){
  const x=LANE_X[l];
  ctx.fillStyle='rgba(255,255,255,.035)';
  ctx.beginPath();
  ctx.moveTo(CX+(x-CX)*0.2-26,HORIZON+40);ctx.lineTo(CX+(x-CX)*0.2+26,HORIZON+40);
  ctx.lineTo(x+74,H);ctx.lineTo(x-74,H);ctx.closePath();ctx.fill();
 }
 // rails
 ctx.strokeStyle='rgba(190,205,255,.30)';ctx.lineWidth=2;
 for(let l=0;l<3;l++){const x=LANE_X[l];
  for(const off of [-52,52]){
   ctx.beginPath();ctx.moveTo(CX+(x-CX)*0.2+off*0.2,HORIZON+40);ctx.lineTo(x+off,H);ctx.stroke();}
 }
 // sleepers
 ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=3;
 for(let i=0;i<16;i++){const z=((i/16)*18+ (runT*speed*0.02)%1.125);const p=proj(z);
  const y=p.gy;const w=180*p.s;ctx.beginPath();ctx.moveTo(CX-w,y);ctx.lineTo(CX+w,y);ctx.stroke();}
}
function drawCoin(c){
 const p=proj(c.z);const r=Math.max(2,10*p.s);
 const x=CX+(c.x-CX)*p.s,y=p.gy-(c.y*95)*p.s;
 ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.ellipse(x,y,r,r*1.15,0,0,6.284);ctx.fill();
 ctx.fillStyle='#fff3a8';ctx.beginPath();ctx.ellipse(x-r*0.25,y,r*0.45,r*0.6,0,0,6.284);ctx.fill();
}
function drawTrain(o){
 const zf=o.z,zb=o.z+o.len;const pf=proj(zf),pb=proj(zb);
 const U=95,hw=o.w*U/2;
 const fx=CX+(o.x-CX)*pf.s,fy=pf.gy,fw=hw*pf.s,fh=2.55*U*pf.s;
 const bx=CX+(o.x-CX)*pb.s,by=pb.gy,bw=hw*pb.s,bh=2.55*U*pb.s;
 const col={'red':'#c2352f','blue':'#2f5fc2','green':'#2f9e52','yellow':'#d4a017'}[o.kind];
 ctx.fillStyle='#0d1024';ctx.fillRect(bx-bw,by-bh,bw*2,bh);
 ctx.fillStyle=col;ctx.fillRect(fx-fw,fy-fh,fw*2,fh);
 ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(fx-fw,fy-fh,fw*2,fh*0.22);
 ctx.fillStyle='#1b2036';ctx.fillRect(fx-fw*0.8,fy-fh*0.78,fw*1.6,fh*0.32);
 ctx.fillStyle='#ffe9a8';
 ctx.fillRect(fx-fw*0.7,fy-fh*0.7,fw*0.28,fh*0.16);ctx.fillRect(fx+fw*0.42,fy-fh*0.7,fw*0.28,fh*0.16);
 ctx.fillStyle='#1b2036';ctx.fillRect(fx-fw,fy-fh*0.16,fw*2,fh*0.16);
}
