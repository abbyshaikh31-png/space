<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rail Rush - Endless Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 12%,#2a3a78 0,#0e1738 45%,#070a16 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.row{display:flex;gap:9px}
.card{background:rgba(6,10,24,.7);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 14px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35);min-width:78px}
.lbl{font-size:9px;letter-spacing:2px;color:#9aa6c9;text-transform:uppercase}
.val{font-size:23px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.gold{color:#ffd84d}
.actions{display:flex;gap:8px;pointer-events:auto}
.ibtn{border:1px solid rgba(255,255,255,.16);background:rgba(6,10,24,.7);border-radius:11px;height:40px;padding:0 12px;font-size:10px;letter-spacing:1.5px;font-weight:700;color:#cfd8f5;cursor:pointer}
.ibtn:hover{background:#27346a;color:#fff}
</style>
]<]minimax[>[</head>
