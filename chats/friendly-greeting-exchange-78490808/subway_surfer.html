<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Rush - Endless Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 10%,#2b3b7d,#0e1738 45%,#070a16)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.row{display:flex;gap:8px}
.card{background:rgba(6,10,24,.68);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:8px 13px;backdrop-filter:blur(8px);min-width:74px}
.lbl{font-size:9px;letter-spacing:2px;color:#93a0c4;text-transform:uppercase}
.val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.gold{color:#ffd84d}
.acts{display:flex;gap:7px;pointer-events:auto}
.ibtn{border:1px solid rgba(255,255,255,.16);background:rgba(6,10,24,.66);border-radius:10px;height:36px;padding:0 11px;font-size:10px;letter-spacing:1.3px;font-weight:700;color:#cbd5f2;cursor:pointer}
.ibtn:hover{background:#27356d;color:#fff}
]<]minimax[>[
